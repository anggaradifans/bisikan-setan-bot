name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Deploy one push at a time, in order.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          # Take the newest 24.x patch (security releases), not the runner's cached one.
          check-latest: true
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      # Pull requests (and manual runs on other branches) only check that the Worker builds.
      - name: Check the Worker builds
        if: github.ref != 'refs/heads/main'
        run: npx wrangler deploy --dry-run

      - name: Deploy
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          if [[ -z "$DISCORD_COMMAND_REGISTRATION_KEY_HASH" ]]; then
            npm run deploy
          else
            npm run deploy -- \
              --var "DISCORD_APPLICATION_ID:$DISCORD_APPLICATION_ID" \
              --var "DISCORD_GUILD_ID:$DISCORD_GUILD_ID" \
              --var "DISCORD_COMMAND_REGISTRATION_KEY_HASH:$DISCORD_COMMAND_REGISTRATION_KEY_HASH"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DISCORD_APPLICATION_ID: ${{ vars.DISCORD_APPLICATION_ID }}
          DISCORD_GUILD_ID: ${{ vars.DISCORD_GUILD_ID }}
          DISCORD_COMMAND_REGISTRATION_KEY_HASH: ${{ vars.DISCORD_COMMAND_REGISTRATION_KEY_HASH }}

  check-gateway:
    if: github.ref == 'refs/heads/main'
    needs: test-and-deploy
    uses: ./.github/workflows/gateway-health.yml
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
